<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gradient Test Improved</title>
<style>
body {
  margin: 0;
  height: 100vh;
  display: grid;
  place-items: center;

  /* نسخه ارتقا یافته گرادینت */
  background: linear-gradient(120deg,
    #87FFE7,
    #C4FAEA,
    #FFE3F8,
    #FFD7B0,
    #CFFFD9,
    #ABFFEE,
    #FFF6DB,
    #FFE1DB
  );
  background-size: 800% 800%; /* بزرگتر = حرکت نرم‌تر */
  animation: gradientFlow 29s ease-in-out infinite;
  overflow: hidden;
}

/* حرکت نرم گرادینت */
@keyframes gradientFlow {
  0%   { background-position: 0% 50%; filter: brightness(100%); }
  25%  { background-position: 50% 25%; filter: brightness(103%); }
  50%  { background-position: 100% 50%; filter: brightness(105%); }
  75%  { background-position: 50% 75%; filter: brightness(103%); }
  100% { background-position: 0% 50%; filter: brightness(100%); }
}

/* نویز سینماتیک */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image: url("https://grainy-gradients.vercel.app/noise.svg");
  opacity: 0.18; /* شدت نویز */
  mix-blend-mode: overlay;
}

/* کارت شیشه‌ای */
.glass-card {
  backdrop-filter: blur(25px) saturate(180%);
  -webkit-backdrop-filter: blur(25px) saturate(180%);
  background: rgba(255, 255, 255, 0.14);
  border-radius: 18px;
  border: 1px solid rgba(255, 255, 255, 0.25);
  padding: 32px 48px;
  font-size: 1.1rem;
  color: white;
}

/* گزینه برای کاهش حرکت برای دسترسی */
@media (prefers-reduced-motion: reduce){
  body { animation: none !important; }
}
</style>
</head>
<body>
</body>
</html>
